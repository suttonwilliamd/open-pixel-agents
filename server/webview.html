<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Agents - OpenCode</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Courier New', monospace;
      background: #1a1a2e;
      color: #eee;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    #header {
      background: #16213e;
      padding: 10px 15px;
      border-bottom: 2px solid #0f3460;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    #header h1 { font-size: 16px; color: #e94560; }
    
    .header-controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    
    .header-btn {
      background: #0f3460;
      color: #eee;
      border: none;
      padding: 5px 12px;
      cursor: pointer;
      font-size: 12px;
      border-radius: 4px;
    }
    
    .header-btn:hover { background: #1a4a7a; }
    
    #status { font-size: 12px; color: #888; }
    #status.connected { color: #4ade80; }
    #status.disconnected { color: #ef4444; }
    
    #office {
      flex: 1;
      background: #2d2d44;
      position: relative;
      overflow: hidden;
    }
    
    #tool-overlay {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
      border: 2px solid #e94560;
      box-shadow: 0 4px 20px rgba(233, 69, 96, 0.3);
      max-width: 80%;
    }
    
    #tool-overlay.visible { display: block; }
    
    .speech-bubble {
      position: absolute;
      background: white;
      color: #1a1a2e;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 12px;
      display: none;
      border: 3px solid #e94560;
      max-width: 250px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      z-index: 100;
    }
    
    .speech-bubble.visible { display: block; }
    
    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -12px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 12px solid #e94560;
    }
    
    .speech-bubble.thinking { border-color: #fbbf24; }
    .speech-bubble.thinking::after { border-top-color: #fbbf24; }
    
    .speech-bubble.waiting { border-color: #4ade80; }
    .speech-bubble.waiting::after { border-top-color: #4ade80; }
    
    .speech-bubble.tool { border-color: #60a5fa; }
    .speech-bubble.tool::after { border-top-color: #60a5fa; }
    
    #input-area {
      background: #16213e;
      padding: 10px;
      border-top: 2px solid #0f3460;
      display: flex;
      gap: 10px;
    }
    
    #input-area input {
      flex: 1;
      background: #0f0f1a;
      border: 1px solid #0f3460;
      color: #eee;
      padding: 10px 14px;
      font-family: inherit;
      font-size: 14px;
      border-radius: 4px;
    }
    
    #input-area input:focus {
      outline: none;
      border-color: #e94560;
    }
    
    #input-area button {
      background: #e94560;
      color: white;
      border: none;
      padding: 10px 24px;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      border-radius: 4px;
    }
    
    #input-area button:hover { background: #ff6b6b; }
    
    #toggle-sound {
      font-size: 18px;
      background: #0f3460;
      border: none;
      padding: 6px 12px;
      cursor: pointer;
      border-radius: 4px;
    }
    
    #toggle-sound.muted { opacity: 0.5; }
  </style>
</head>
<body>
  <div id="header">
    <h1>🖥️ Pixel Agents - OpenCode</h1>
    <div class="header-controls">
      <button id="toggle-sound" class="muted">🔇</button>
      <span id="status" class="disconnected">● Disconnected</span>
    </div>
  </div>
  
  <div id="office">
    <canvas id="canvas"></canvas>
    <div id="speech-bubble" class="speech-bubble"></div>
    <div id="tool-overlay"></div>
  </div>
  
  <div id="input-area">
    <input type="text" id="prompt" placeholder="Ask OpenCode something..." />
    <button id="send">Send</button>
  </div>

  <script>
    // Audio context for sound notifications
    let audioCtx = null;
    let soundEnabled = false;
    
    function playSound(type) {
      if (!soundEnabled || !audioCtx) return;
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      if (type === 'done') {
        osc.frequency.setValueAtTime(523, audioCtx.currentTime);
        osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.1);
        osc.frequency.setValueAtTime(784, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.4);
      } else if (type === 'thinking') {
        osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.2);
      }
    }
    
    // Toggle sound
    const soundBtn = document.getElementById('toggle-sound');
    soundBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? '🔊' : '🔇';
      soundBtn.classList.toggle('muted', !soundEnabled);
      if (soundEnabled && !audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    });
    
    console.log('[Pixel Agents] Script starting...');
    
    const statusEl = document.getElementById('status');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const toolOverlay = document.getElementById('tool-overlay');
    const speechBubble = document.getElementById('speech-bubble');
    const promptInput = document.getElementById('prompt');
    const sendBtn = document.getElementById('send');

    // Character sprite images (6 characters)
    const characterSprites = [];
    let spritesLoaded = false;
    
    // Load character sprites
    function loadSprites() {
      let loaded = 0;
      for (let i = 0; i < 6; i++) {
        const img = new Image();
        img.onload = () => {
          loaded++;
          if (loaded === 6) {
            spritesLoaded = true;
            console.log('[Pixel Agents] All sprites loaded!');
          }
        };
        img.onerror = () => {
          console.error('[Pixel Agents] Failed to load sprite:', i);
          loaded++; // Continue anyway
        };
        img.src = `/assets/char_${i}.png`;
        characterSprites.push(img);
      }
    }
    loadSprites();

    // Agent state
    let agents = [
      {
        id: 1,
        x: 0,
        y: 0,
        state: 'idle',
        paletteIndex: 0,
        toolStatus: '',
        isWaiting: false
      }
    ];
    let eventSource = null;
    let frameCount = 0;

    // Resize canvas
    function resizeCanvas() {
      const office = document.getElementById('office');
      const rect = office.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
    }

    // Draw sprite at position (using first frame as placeholder)
    function drawCharacterSprite(ctx, img, x, y, scale = 4) {
      if (!img || !img.complete) return;
      const w = img.width;
      const h = img.height;
      // Draw at scale
      ctx.drawImage(img, x, y, w * scale, h * scale);
    }

    // Draw the office with furniture
    function render() {
      frameCount++;
      const w = canvas.width;
      const h = canvas.height;
      
      // Floor
      ctx.fillStyle = '#2d2d44';
      ctx.fillRect(0, 0, w, h);
      
      // Checkered floor
      const tileSize = 50;
      for (let x = 0; x < w; x += tileSize) {
        for (let y = h * 0.4; y < h; y += tileSize) {
          if ((x/tileSize + (y-h*0.4)/tileSize) % 2 === 0) {
            ctx.fillStyle = '#353550';
            ctx.fillRect(x, y, tileSize, tileSize);
          }
        }
      }
      
      // Back wall
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(0, 0, w, h * 0.4);
      
      // Wall border
      ctx.fillStyle = '#e94560';
      ctx.fillRect(0, h * 0.38, w, 6);
      
      // Wall decorations - framed picture
      ctx.fillStyle = '#4a3728';
      ctx.fillRect(50, h * 0.15, 120, 90);
      ctx.fillStyle = '#1a5';
      ctx.fillRect(55, h * 0.17, 110, 70);
      // Landscape
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(55, h * 0.40, 110, 35);
      ctx.fillStyle = '#60a5fa';
      ctx.fillRect(55, h * 0.17, 110, 25);
      
      // Bookshelf
      ctx.fillStyle = '#4a3728';
      ctx.fillRect(200, h * 0.25, 200, 12);
      // Books
      const bookColors = ['#e94560', '#4ade80', '#60a5fa', '#fbbf24', '#a855f7'];
      for (let i = 0; i < 5; i++) {
        ctx.fillStyle = bookColors[i];
        ctx.fillRect(205 + i * 20, h * 0.16, 16, 22 + (i % 3) * 5);
      }
      
      // Plant
      ctx.fillStyle = '#166534';
      ctx.beginPath();
      ctx.arc(w - 100, h * 0.38, 35, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#8b4513';
      ctx.fillRect(w - 115, h * 0.38, 30, 45);
      
      // Desk
      const deskX = w/2 - 120;
      const deskY = h * 0.65;
      ctx.fillStyle = '#5c4433';
      ctx.fillRect(deskX, deskY, 240, 15);
      ctx.fillRect(deskX, deskY + 15, 240, 60);
      
      // Monitor
      ctx.fillStyle = '#333';
      ctx.fillRect(deskX + 60, deskY - 50, 120, 70);
      ctx.fillStyle = '#1a5';
      ctx.fillRect(deskX + 65, deskY - 45, 110, 55);
      // Code
      ctx.fillStyle = '#0f0';
      ctx.font = '8px monospace';
      ctx.fillText('function() {', deskX + 68, deskY - 30);
      ctx.fillText('  return true;', deskX + 68, deskY - 18);
      ctx.fillStyle = '#444';
      ctx.fillRect(deskX + 100, deskY - 10, 40, 25);
      
      // Keyboard
      ctx.fillStyle = '#444';
      ctx.fillRect(deskX + 55, deskY + 20, 80, 20);
      ctx.fillStyle = '#555';
      for (let i = 0; i < 8; i++) {
        ctx.fillRect(deskX + 57 + i * 10, deskY + 22, 8, 6);
      }
      ctx.fillStyle = '#555';
      ctx.fillRect(deskX + 145, deskY + 22, 15, 20);
      
      // Desk legs
      ctx.fillStyle = '#333';
      ctx.fillRect(deskX + 10, deskY + 75, 15, 40);
      ctx.fillRect(deskX + 215, deskY + 75, 15, 40);
      
      // Chair
      const chairX = w/2 - 40;
      const chairY = deskY + 70;
      ctx.fillStyle = '#e94560';
      ctx.fillRect(chairX, chairY, 80, 15);
      ctx.fillRect(chairX + 30, chairY - 40, 20, 50);
      ctx.fillStyle = '#333';
      ctx.fillRect(chairX + 35, chairY + 15, 10, 35);
      ctx.fillRect(chairX + 15, chairY + 50, 50, 10);
      
      // Draw character sprite
      const agent = agents[0];
      const sprite = characterSprites[agent.paletteIndex];
      if (spritesLoaded && sprite && sprite.complete) {
        // Position at desk
        const charX = chairX + 10 - (sprite.width * 2);
        const charY = chairY - 60 - (sprite.height * 2);
        
        // Draw the sprite scaled
        ctx.drawImage(sprite, charX, charY, sprite.width * 4, sprite.height * 4);
        
        // Tool status text
        if (agent.toolStatus) {
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 14px monospace';
          ctx.textAlign = 'center';
          ctx.fillText(agent.toolStatus.slice(0, 30), charX + sprite.width * 2, charY - 10);
        }
      } else {
        // Fallback: draw simple character
        const charX = w/2 - 20;
        const charY = chairY - 10;
        ctx.fillStyle = agent.state === 'idle' ? '#e94560' : '#4ade80';
        ctx.fillRect(charX, charY, 40, 50);
        ctx.fillStyle = '#ffccaa';
        ctx.fillRect(charX + 5, charY - 20, 30, 25);
        ctx.fillStyle = '#000';
        ctx.fillRect(charX + 8, charY - 12, 5, 5);
        ctx.fillRect(charX + 25, charY - 12, 5, 5);
      }
      
      requestAnimationFrame(render);
    }

    // Update speech bubble
    function updateSpeechBubble() {
      const agent = agents[0];
      
      if (agent.isWaiting) {
        speechBubble.textContent = '💭 Waiting for you...';
        speechBubble.className = 'speech-bubble visible waiting';
      } else if (agent.state === 'thinking' && agent.toolStatus) {
        speechBubble.textContent = '🤔 ' + agent.toolStatus;
        speechBubble.className = 'speech-bubble visible thinking';
      } else if (agent.toolStatus && agent.state === 'working') {
        speechBubble.textContent = '⚡ ' + agent.toolStatus;
        speechBubble.className = 'speech-bubble visible tool';
      } else {
        speechBubble.className = 'speech-bubble';
      }
      
      // Position
      const w = canvas.width;
      speechBubble.style.left = (w/2 - 125) + 'px';
      speechBubble.style.top = (h = canvas.height * 0.15) + 'px';
      
      // Tool overlay
      if (agent.toolStatus) {
        toolOverlay.textContent = agent.toolStatus;
        toolOverlay.classList.add('visible');
      } else {
        toolOverlay.classList.remove('visible');
      }
    }

    // SSE connection
    function connect() {
      console.log('[Pixel Agents] Connecting to SSE...');
      if (eventSource) eventSource.close();
      
      eventSource = new EventSource('/events');
      
      eventSource.onopen = () => {
        console.log('[Pixel Agents] SSE connected!');
        statusEl.textContent = '● Connected';
        statusEl.className = 'connected';
      };

      eventSource.onerror = (e) => {
        console.error('[Pixel Agents] SSE error:', e);
        statusEl.textContent = '● Disconnected';
        statusEl.className = 'disconnected';
        setTimeout(connect, 3000);
      };

      eventSource.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          handleMessage(msg);
        } catch (err) {}
      };
    }

    function handleMessage(msg) {
      const agent = agents[0];
      
      switch (msg.type) {
        case 'connected':
          console.log('[Pixel Agents] Connected to server!');
          break;
        case 'agentStatus':
          if (msg.status === 'active') {
            agent.state = 'working';
            agent.isWaiting = false;
          } else if (msg.status === 'waiting') {
            agent.state = 'idle';
            agent.isWaiting = true;
            playSound('done');
          }
          break;
        case 'agentThinking':
          agent.state = 'thinking';
          agent.toolStatus = (msg.text || 'Thinking...').slice(0, 40);
          playSound('thinking');
          break;
        case 'agentResponding':
          agent.state = 'working';
          agent.toolStatus = (msg.text || 'Writing...').slice(0, 40);
          break;
        case 'agentToolStart':
          agent.state = 'working';
          agent.toolStatus = msg.status || 'Working...';
          break;
        case 'agentToolDone':
        case 'agentToolsClear':
          agent.toolStatus = '';
          break;
      }
      
      updateSpeechBubble();
    }

    // Send message
    async function sendPrompt() {
      const text = promptInput.value.trim();
      if (!text) return;
      
      const agent = agents[0];
      agent.state = 'thinking';
      agent.toolStatus = 'Sending...';
      updateSpeechBubble();
      
      try {
        const res = await fetch('/prompt', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        await res.json();
        promptInput.value = '';
      } catch (err) {
        console.error('[Pixel Agents] Send error:', err);
        agent.toolStatus = 'Error sending!';
        updateSpeechBubble();
      }
    }

    sendBtn.addEventListener('click', sendPrompt);
    promptInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendPrompt();
    });

    // Init
    window.addEventListener('load', () => {
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
      connect();
      render();
      updateSpeechBubble();
    });
  </script>
</body>
</html>
