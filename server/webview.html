<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Agents - OpenCode</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Courier New', monospace;
      background: #1a1a2e;
      color: #eee;
      overflow: hidden;
      height: 100vh;
    }
    
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    
    #header {
      background: #16213e;
      padding: 10px 15px;
      border-bottom: 2px solid #0f3460;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    #header h1 {
      font-size: 16px;
      color: #e94560;
    }
    
    #status {
      font-size: 12px;
      color: #888;
    }
    
    #status.connected { color: #4ade80; }
    #status.disconnected { color: #ef4444; }
    
    #office {
      flex: 1;
      position: relative;
      background: #0f0f1a;
      overflow: hidden;
    }
    
    canvas {
      display: block;
      image-rendering: pixelated;
    }
    
    #tool-overlay {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 12px;
      display: none;
    }
    
    #tool-overlay.visible { display: block; }
    
    #input-area {
      background: #16213e;
      padding: 10px;
      border-top: 2px solid #0f3460;
      display: flex;
      gap: 10px;
    }
    
    #input-area input {
      flex: 1;
      background: #0f0f1a;
      border: 1px solid #0f3460;
      color: #eee;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 14px;
    }
    
    #input-area input:focus {
      outline: none;
      border-color: #e94560;
    }
    
    #input-area button {
      background: #e94560;
      color: white;
      border: none;
      padding: 8px 20px;
      cursor: pointer;
      font-family: inherit;
    }
    
    #input-area button:hover {
      background: #ff6b6b;
    }
    
    #agent-bubble {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      color: black;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
      display: none;
      white-space: nowrap;
    }
    
    #agent-bubble.visible { display: block; }
    
    #agent-bubble::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 6px solid white;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="header">
      <h1>🖥️ Pixel Agents - OpenCode</h1>
      <span id="status" class="disconnected">● Disconnected</span>
    </div>
    
    <div id="office">
      <canvas id="canvas"></canvas>
      <div id="agent-bubble"></div>
      <div id="tool-overlay"></div>
    </div>
    
    <div id="input-area">
      <input type="text" id="prompt" placeholder="Ask OpenCode something..." />
      <button id="send">Send</button>
    </div>
  </div>

  <script>
    // Simple SSE connection
    const statusEl = document.getElementById('status');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const toolOverlay = document.getElementById('tool-overlay');
    const agentBubble = document.getElementById('agent-bubble');
    const promptInput = document.getElementById('prompt');
    const sendBtn = document.getElementById('send');

    // Canvas setup
    const CELL_SIZE = 4;
    let officeWidth, officeHeight;

    function resizeCanvas() {
      const office = document.getElementById('office');
      canvas.width = office.clientWidth;
      canvas.height = office.clientHeight;
      officeWidth = Math.floor(canvas.width / CELL_SIZE);
      officeHeight = Math.floor(canvas.height / CELL_SIZE);
      render();
    }

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Agent state
    let agent = {
      x: 10,
      y: 10,
      state: 'idle', // idle, walking, typing, reading, waiting
      direction: 'down',
      color: '#e94560',
      toolStatus: '',
      isWaiting: false
    };

    // Simple pixel office rendering
    function render() {
      // Clear
      ctx.fillStyle = '#0f0f1a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw floor grid (subtle)
      ctx.strokeStyle = '#1a1a2e';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += CELL_SIZE * 4) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += CELL_SIZE * 4) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // Draw desk
      ctx.fillStyle = '#4a3728';
      ctx.fillRect(canvas.width / 2 - 20, canvas.height / 2 - 8, 40, 16);
      ctx.fillStyle = '#5c4433';
      ctx.fillRect(canvas.width / 2 - 18, canvas.height / 2 - 6, 36, 12);

      // Draw chair
      ctx.fillStyle = '#e94560';
      ctx.fillRect(canvas.width / 2 - 6, canvas.height / 2 + 8, 12, 8);

      // Draw agent
      const ax = agent.x * CELL_SIZE * 4 + canvas.width / 2 - 10;
      const ay = agent.y * CELL_SIZE * 4 + canvas.height / 2 - 16;

      // Body
      ctx.fillStyle = agent.color;
      ctx.fillRect(ax, ay, 20, 24);

      // Head
      ctx.fillStyle = '#ffccaa';
      ctx.fillRect(ax + 4, ay - 8, 12, 12);

      // Eyes (based on state)
      ctx.fillStyle = '#000';
      if (agent.state === 'waiting' || agent.isWaiting) {
        // Closed eyes (sleeping)
        ctx.fillRect(ax + 6, ay - 2, 3, 1);
        ctx.fillRect(ax + 11, ay - 2, 3, 1);
      } else if (agent.state === 'typing' || agent.state === 'reading') {
        // Looking at screen
        ctx.fillRect(ax + 6, ay - 3, 2, 2);
        ctx.fillRect(ax + 12, ay - 3, 2, 2);
      } else {
        // Normal eyes
        ctx.fillRect(ax + 5, ay - 2, 3, 3);
        ctx.fillRect(ax + 12, ay - 2, 3, 3);
      }

      // Tool status
      if (agent.toolStatus) {
        toolOverlay.textContent = agent.toolStatus;
        toolOverlay.classList.add('visible');
      } else {
        toolOverlay.classList.remove('visible');
      }

      // Waiting bubble
      if (agent.isWaiting) {
        agentBubble.textContent = '💭 Waiting for you...';
        agentBubble.classList.add('visible');
      } else {
        agentBubble.classList.remove('visible');
      }

      // Animation loop
      requestAnimationFrame(render);
    }

    // SSE connection
    function connect() {
      const eventSource = new EventSource('/events');
      
      eventSource.onopen = () => {
        statusEl.textContent = '● Connected';
        statusEl.className = 'connected';
      };

      eventSource.onerror = () => {
        statusEl.textContent = '● Disconnected';
        statusEl.className = 'disconnected';
        setTimeout(connect, 2000);
      };

      eventSource.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          handleMessage(msg);
        } catch {}
      };
    }

    function handleMessage(msg) {
      console.log('Message:', msg);

      switch (msg.type) {
        case 'agentStatus':
          if (msg.status === 'active') {
            agent.state = 'typing';
            agent.isWaiting = false;
          } else if (msg.status === 'waiting') {
            agent.state = 'idle';
            agent.isWaiting = true;
          }
          break;

        case 'agentToolStart':
          agent.toolStatus = msg.status;
          agent.state = 'typing';
          break;

        case 'agentToolDone':
          agent.toolStatus = '';
          break;

        case 'agentToolsClear':
          agent.toolStatus = '';
          break;

        case 'connected':
          console.log('Connected to Pixel Agents server!');
          break;
      }
    }

    // Send message
    function sendPrompt() {
      const text = promptInput.value.trim();
      if (!text) return;

      // For now, we just show it in the tool overlay
      // In a full implementation, this would POST to the server
      toolOverlay.textContent = `Sending: ${text.slice(0, 30)}...`;
      toolOverlay.classList.add('visible');

      promptInput.value = '';
    }

    sendBtn.addEventListener('click', sendPrompt);
    promptInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendPrompt();
    });

    // Start
    connect();
    render();
  </script>
</body>
</html>
